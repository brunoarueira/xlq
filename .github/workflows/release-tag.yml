name: Release tag

# Runs on every push to main, but only actually does anything the one
# time in however many pushes that VERSION bumped and doesn't have a
# tag yet - see the "tag already exists" check below, and ADR-0006.
# Tagging is all this workflow does; release-build.yml, triggered by
# the tag it pushes, does the actual cross-compiled build.
on:
  push:
    branches: ["main"]
    paths:
      - "VERSION"

# A second push landing while a tag from the first is still being
# created should queue behind it, not race it.
concurrency:
  group: release-tag-${{ github.workflow }}
  cancel-in-progress: false

# Needs to push a tag - the only workflow in this repo that isn't
# read-only. Scoped to just that.
permissions:
  contents: write

jobs:
  tag:
    name: tag on a VERSION bump
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true # needs to push a tag below

      - name: Read VERSION
        id: version
        run: |
          version=$(tr -d '[:space:]' < VERSION)
          if [ -z "$version" ]; then
            echo "::error::VERSION is empty" >&2
            exit 1
          fi
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Check whether the tag already exists
        id: check
        run: |
          # Checked against origin directly, not the local clone - this
          # doesn't depend on how much history actions/checkout fetched.
          if git ls-remote --exit-code --tags origin "refs/tags/${{ steps.version.outputs.tag }}" >/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create and push the tag
        if: steps.check.outputs.exists == 'false'
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "$TAG"
          git push origin "$TAG"
