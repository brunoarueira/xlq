name: CI

on:
  push:
    branches: ["**"]
  pull_request:

# Cancel superseded runs on the same ref (branch or PR) so pushes don't
# pile up queued/running jobs.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# No job needs to write to the repo or use secrets; keep the default
# GITHUB_TOKEN read-only.
permissions:
  contents: read

jobs:
  test:
    name: build, vet, test, fmt
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt needs to be run on:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Test
        run: go test ./... -race -cover

  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: latest

  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Complements Dependabot (#53): Dependabot only ever proposes a
      # version bump, so it can't flag a dependency already pinned to
      # a version with a known advisory and no newer release to bump
      # to - exactly excelize's situation as of #52. govulncheck also
      # does call-graph analysis, so it only flags an advisory whose
      # vulnerable code is actually reachable from xlq's own code, not
      # every CVE anywhere in the dependency tree.
      #
      # continue-on-error: this job is deliberately non-blocking right
      # now. As of #52, 4 excelize advisories are reachable with no
      # fixed release to bump to yet, and recover()/timeout-style
      # mitigations (#49/#50) don't remove a call from govulncheck's
      # static reachability analysis the way actually dropping the
      # call would - so a blocking job would stay permanently red
      # until excelize ships a fix, independent of anything xlq itself
      # does. The value here is visibility on every push (a *new*
      # advisory, or a stdlib one like GO-2026-6088, still shows up
      # immediately) without that unrelated, open-ended red build.
      # Revisit once excelize ships a release or the known findings
      # are otherwise resolved.
      - name: govulncheck
        uses: golang/govulncheck-action@032d45514ae346b1db93c04b0c90b841c370344f # v1.1.0
        with:
          go-version-file: go.mod
        continue-on-error: true
