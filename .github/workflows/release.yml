name: Release

# Runs on every push to main that touches VERSION, but only actually
# cuts a release the one time in however many pushes that VERSION
# bumped to a version that isn't tagged yet - see the "tag already
# exists" check below, and ADR-0006.
#
# Tagging and building happen in the *same* job/run, not two workflows
# chained by "push a tag, let that trigger a second workflow": GitHub
# doesn't fire workflow runs for pushes made with the default
# GITHUB_TOKEN (an anti-recursion safeguard), so a tag pushed by this
# workflow would never trigger a separate tag-triggered workflow.
on:
  push:
    branches: ["main"]
    paths:
      - "VERSION"
  workflow_dispatch: {} # manual escape hatch, e.g. to retry after a failed run

# A second push landing while a tag/release from the first is still
# being created should queue behind it, not race it.
concurrency:
  group: release-${{ github.workflow }}
  cancel-in-progress: false

# Needs to push a tag and create a GitHub Release - the only workflow
# in this repo that isn't read-only. ci.yml never writes to the repo.
permissions:
  contents: write

jobs:
  tag-and-release:
    name: tag + release on a VERSION bump
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # id-token: write is added here, scoped to just this job (least
    # privilege), on top of the workflow-level contents: write - cosign
    # needs to request a GitHub Actions OIDC token for keyless signing
    # (#130, ADR-0039), the same permission binary-provenance below
    # already needs for its own, separate purpose.
    permissions:
      contents: write
      id-token: write
    # hashes and tag both feed binary-provenance below (#129, ADR-0038) -
    # hashes is empty on a no-op run (tag already exists, GoReleaser
    # never ran), which is also what that job's own "if" checks to skip
    # itself in that case.
    outputs:
      hashes: ${{ steps.hashes.outputs.hashes }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true # needs to push a tag below
          fetch-depth: 0 # goreleaser needs full history for release notes

      - name: Read VERSION
        id: version
        run: |
          version=$(tr -d '[:space:]' < VERSION)
          if [ -z "$version" ]; then
            echo "::error::VERSION is empty" >&2
            exit 1
          fi
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Check whether the tag already exists
        id: check
        run: |
          # Checked against origin directly, not the local clone - this
          # doesn't depend on how much history actions/checkout fetched.
          if git ls-remote --exit-code --tags origin "refs/tags/${{ steps.version.outputs.tag }}" >/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create and push the tag
        if: steps.check.outputs.exists == 'false'
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "$TAG"
          git push origin "$TAG"

      - name: Install Go
        if: steps.check.outputs.exists == 'false'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      # Installs the cosign CLI GoReleaser's signs: step below shells
      # out to (#130, ADR-0039) - GoReleaser doesn't bundle it.
      - name: Install cosign
        if: steps.check.outputs.exists == 'false'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: GoReleaser
        if: steps.check.outputs.exists == 'false'
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          # Pinned, not "latest": the homebrew_casks hooks.post.install_steps
          # syntax (see .goreleaser.yaml) is schema-version-sensitive - v2.19.0
          # renamed the field (from "install") and its template variable (from
          # Ruby "#{staged_path}" to Go "{{ .StagedPath }}"), the exact
          # breakage this comment warned about before it happened
          # (docs/adr/0016-homebrew-publishing.md has the history). An
          # unpinned upgrade could silently reintroduce that kind of breakage
          # on some future release.
          version: v2.19.0
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}

      # dist/checksums.txt's own name is pinned by .goreleaser.yaml's
      # checksum.name_template, not discovered dynamically here - no
      # need to parse goreleaser-action's own artifacts output for it.
      # Already in the sha256sum-line format slsa-github-generator's
      # base64-subjects input expects (one "<digest>  <filename>" line
      # per artifact), since that's what GoReleaser's checksum step
      # itself produces.
      - name: Expose checksums.txt for SLSA provenance (#129, ADR-0038)
        if: steps.check.outputs.exists == 'false'
        id: hashes
        run: echo "hashes=$(base64 -w0 dist/checksums.txt)" >> "$GITHUB_OUTPUT"

  # SLSA Build L3 provenance for the release binaries (#129, ADR-0038):
  # attests that these exact artifacts were built by this exact GitHub
  # Actions workflow run, from this exact source commit - not GoReleaser
  # itself (which has no native provenance generation), and not the
  # dedicated SLSA Go builder either (which would mean giving up
  # GoReleaser's own build/archive/checksum/Homebrew-cask step
  # entirely).
  #
  # Pinned by the exact "@vX.Y.Z" tag, NOT a commit SHA - a deliberate
  # exception to every other "uses:" line in this repo (confirmed
  # against slsa-github-generator's own README before writing this: it
  # requires being referenced by its full semantic-version tag so
  # slsa-verifier can validate the generator's own ref later; a shorter
  # tag like "@v2.1" or "@v2" fails outright, and pinning by SHA isn't
  # supported at all, for the same reason - this is the one place in
  # this repo where tag-pinning is the deliberately correct choice, not
  # an oversight).
  #
  # upload-tag-name is required here, not optional the way most of the
  # generator's own integration examples show it (e.g. its GoReleaser
  # one, upload-assets: true alone, no upload-tag-name): those assume
  # the whole workflow is *triggered by* the tag push itself, so
  # github.ref already is refs/tags/vX.Y.Z by the time this job runs.
  # This workflow deliberately isn't triggered that way (ADR-0006: it
  # creates and pushes the tag itself, inside a run triggered by a push
  # to main, specifically to avoid GITHUB_TOKEN's own pushes not
  # triggering a second, tag-triggered workflow run) - so github.ref
  # here is always refs/heads/main, never the tag, and upload-assets
  # alone would silently upload nothing. upload-tag-name tells it
  # explicitly which release to attach the provenance to instead,
  # confirmed against the generator's own README, which documents
  # exactly this combination for a non-tag-triggered caller.
  binary-provenance:
    name: SLSA Build L3 provenance
    needs: [tag-and-release]
    if: needs.tag-and-release.outputs.hashes != ''
    permissions:
      actions: read # to read this calling workflow's own path
      id-token: write # to sign the provenance
      contents: write # to attach it to the release
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0
    with:
      base64-subjects: "${{ needs.tag-and-release.outputs.hashes }}"
      upload-assets: true
      upload-tag-name: ${{ needs.tag-and-release.outputs.tag }}
