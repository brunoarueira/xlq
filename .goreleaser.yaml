version: 2

project_name: xlq

# Generates the man page from xlq's own Cobra command tree
# (docs/adr/0044-generated-man-pages-and-docs-site-help-links.md): a
# man page produced from the exact command tree of the build it ships
# with can't drift from it the way hand-maintained prose could. The
# ldflags here match builds.ldflags below so the generated page's own
# header reports the real release version, not "dev" (version.Version's
# zero value) - cmd/gendoc isn't one of builds' own entries, so it
# never otherwise gets this injected.
before:
  hooks:
    - go run -ldflags "-X github.com/brunoarueira/xlq/internal/version.Version={{.Version}}" ./cmd/gendoc ./man

builds:
  - id: xlq
    main: ./cmd/xlq
    binary: xlq
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w -X github.com/brunoarueira/xlq/internal/version.Version={{.Version}}

archives:
  - id: xlq
    formats: [tar.gz]
    files:
      - src: man/xlq.1
        dst: xlq.1
      - src: man/xlq-sheets.1
        dst: xlq-sheets.1
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: "checksums.txt"

# SBOM (software bill of materials) for each release archive, SPDX JSON
# via Syft, GoReleaser's own default (docs/adr/0040-sbom-generation.md).
# Syft must be installed in the CI runner before this step
# (.github/workflows/release.yml); it isn't bundled with GoReleaser.
sboms:
  - artifacts: archive

# Keyless cosign signing of the checksum file (docs/adr/0039-cosign-signing.md):
# GitHub Actions' own OIDC identity is the signing credential (via
# Sigstore's Fulcio/Rekor) - no key to generate, store, or rotate.
# cosign itself must be installed in the CI runner before this step
# (sigstore/cosign-installer in .github/workflows/release.yml); it
# isn't something GoReleaser bundles.
signs:
  - cmd: cosign
    signature: "${artifact}.sigstore.json"
    args:
      - "sign-blob"
      - "--bundle=${signature}"
      - "${artifact}"
      - "--yes"
    artifacts: checksum

changelog:
  use: github
  # Default format falls back to the raw git author name/email; this
  # credits the GitHub handle instead (yq-style), e.g.:
  #   * Fix panic on empty sheet (thanks @someuser!)
  # No leading "* " here - GoReleaser already bullets each entry itself.
  format: >-
    {{ .Message }}{{ if .Logins }} (thanks {{ .Logins | englishJoin }}!){{ end }}

# draft: true (docs/adr/0041-draft-then-publish-release.md) - GitHub's
# Immutable Releases feature locks a release's assets the moment it's
# published, and the SLSA provenance job (ADR-0038) runs as a separate,
# later workflow job that needs to attach one more file to this same
# release afterward. release.yml publishes it for real (draft: false)
# only once that job succeeds.
release:
  github:
    owner: brunoarueira
    name: xlq
  draft: true

# See docs/adr/0016-homebrew-publishing.md: homebrew_casks, not the
# soft-deprecated brews - it supports Linux too (on_macos/on_linux
# blocks below, generated automatically from the archives above).
homebrew_casks:
  - name: xlq
    binaries: [xlq]
    repository:
      owner: brunoarueira
      name: homebrew-tap
      branch: main
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    homepage: "https://github.com/brunoarueira/xlq"
    description: "Command-line spreadsheet processor for .xlsx/.csv/.tsv/.ods, jq/yq-style"
    commit_author:
      name: github-actions[bot]
      email: github-actions[bot]@users.noreply.github.com
    # xlq's binaries aren't signed/notarized (see docs/adr/0016-homebrew-publishing.md,
    # corrected by docs/adr/0028-correct-adr-0016-postflight-hook-claim.md
    # for this hook's own syntax). Without this, macOS quarantines a
    # browser/brew-downloaded binary and Gatekeeper refuses to run it
    # at all ("xlq is damaged and cannot be opened") - not a cosmetic
    # nicety, per GoReleaser's own docs on this exact hook.
    #
    # install_steps, not the deprecated install: Homebrew removed the
    # free-form Ruby `postflight do ... end` block in favor of a
    # declarative `postflight_steps do ... end` (only specific helpers
    # like run/on_macos, no arbitrary Ruby) - GoReleaser v2.19.0 added
    # install_steps/uninstall_steps to render that form instead. Note
    # the template variable is now Go-style {{ .StagedPath }}, not
    # Ruby's #{staged_path} (GoReleaser's own templating substitutes it
    # before the cask file is written; the old form left Ruby to
    # resolve #{staged_path} at install time instead).
    hooks:
      post:
        install_steps: |
          on_macos do
            run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "{{ .StagedPath }}/xlq"]
          end
