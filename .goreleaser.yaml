version: 2

project_name: xlq

builds:
  - id: xlq
    main: ./cmd/xlq
    binary: xlq
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w -X github.com/brunoarueira/xlq/internal/version.Version={{.Version}}

archives:
  - id: xlq
    formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: "checksums.txt"

changelog:
  use: github
  # Default format falls back to the raw git author name/email; this
  # credits the GitHub handle instead (yq-style), e.g.:
  #   * Fix panic on empty sheet (thanks @someuser!)
  # No leading "* " here - GoReleaser already bullets each entry itself.
  format: >-
    {{ .Message }}{{ if .Logins }} (thanks {{ .Logins | englishJoin }}!){{ end }}

release:
  github:
    owner: brunoarueira
    name: xlq
