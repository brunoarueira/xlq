version: 2

project_name: xlq

builds:
  - id: xlq
    main: ./cmd/xlq
    binary: xlq
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w -X github.com/brunoarueira/xlq/internal/version.Version={{.Version}}

archives:
  - id: xlq
    formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: "checksums.txt"

changelog:
  use: github
  # Default format falls back to the raw git author name/email; this
  # credits the GitHub handle instead (yq-style), e.g.:
  #   * Fix panic on empty sheet (thanks @someuser!)
  # No leading "* " here - GoReleaser already bullets each entry itself.
  format: >-
    {{ .Message }}{{ if .Logins }} (thanks {{ .Logins | englishJoin }}!){{ end }}

release:
  github:
    owner: brunoarueira
    name: xlq

# See docs/adr/0016-homebrew-publishing.md: homebrew_casks, not the
# soft-deprecated brews - it supports Linux too (on_macos/on_linux
# blocks below, generated automatically from the archives above).
homebrew_casks:
  - name: xlq
    binaries: [xlq]
    repository:
      owner: brunoarueira
      name: homebrew-tap
      branch: main
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    homepage: "https://github.com/brunoarueira/xlq"
    description: "Command-line spreadsheet processor for .xlsx/.csv/.tsv/.ods, jq/yq-style"
    commit_author:
      name: github-actions[bot]
      email: github-actions[bot]@users.noreply.github.com
    # xlq's binaries aren't signed/notarized (see docs/adr/0016-homebrew-publishing.md,
    # corrected by docs/adr/0028-correct-adr-0016-postflight-hook-claim.md
    # for this hook's own syntax). Without this, macOS quarantines a
    # browser/brew-downloaded binary and Gatekeeper refuses to run it
    # at all ("xlq is damaged and cannot be opened") - not a cosmetic
    # nicety, per GoReleaser's own docs on this exact hook.
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/xlq"]
          end
